# Rate limit de borda do Arte no Jardim. Contexto http, por isso vive aqui e
# nao dentro do vhost. Prefixo no nome para nao colidir com zonas do placeadmin.
limit_req_zone $binary_remote_addr zone=artenojardim_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=artenojardim_auth:10m rate=1r/s;
