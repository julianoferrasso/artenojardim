# Nginx -- Arte no Jardim (VPS 179.199.150.80, Debian 13, nginx 1.26)
#
# Topologia:
#   artenojardim.com.br        -> store  (Next, :3010)
#   admin.artenojardim.com.br  -> admin  (Next, :3011)
#   api.artenojardim.com.br    -> api    (Express, :4020)
#
# PORTA DA API: 4020, nao 4000. Na VPS antiga era 4000, que AQUI e o Grafana
# do placeadmin. Confira o dono de uma porta antes de mudar:
#   ss -lptnH "sport = :<porta>"  e  ls -l /proc/<pid>/cwd
#
# `listen 443 ssl;` SEM http2, de proposito. O parametro http2 no listen liga
# o HTTP/2 no SOCKET -- ou seja, em todos os sites da 443, inclusive os do
# placeadmin, que rodam HTTP/1.1. Nao acrescente (nem `http2 on;`).
#
# `Connection "upgrade"` literal, e NAO $connection_upgrade: aquela variavel
# vem de um `map` do placeadmin (conf.d/placeadmin-connection-upgrade.conf).
# Declarar outro map com o mesmo nome e erro de duplicata que impede o nginx
# de subir INTEIRO; e depender do deles acoplaria este site a config alheia.
#
# gzip fica DENTRO de cada server: `gzip on` no http seria duplicata do
# nginx.conf global e derruba o nginx no boot.
#
# CERTIFICADO: `certbot certonly --webroot -w /var/www/letsencrypt`. Nunca
# `--nginx` -- o plugin reescreve o arquivo e ja descartou blocos location
# do financee uma vez.

# -- HTTP -> HTTPS --
server {
    listen 80;
    server_name artenojardim.com artenojardim.com.br
                www.artenojardim.com www.artenojardim.com.br
                api.artenojardim.com.br admin.artenojardim.com.br;

    # Antes do redirect: o Let's Encrypt busca este caminho por HTTP puro.
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# -- .com e www -> canonico --
server {
    listen 443 ssl;
    server_name artenojardim.com www.artenojardim.com www.artenojardim.com.br;

    ssl_certificate     /etc/letsencrypt/live/artenojardim.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artenojardim.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://artenojardim.com.br$request_uri;
}

# -- LOJA --
server {
    listen 443 ssl;
    server_name artenojardim.com.br;

    ssl_certificate     /etc/letsencrypt/live/artenojardim.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artenojardim.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml;

    client_max_body_size 2M;
    access_log /var/log/nginx/artenojardim-store.access.log;
    error_log  /var/log/nginx/artenojardim-store.error.log;

    # Assets com hash no nome sao imutaveis: um ano de cache e seguro.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# -- ADMIN --
server {
    listen 443 ssl;
    server_name admin.artenojardim.com.br;

    ssl_certificate     /etc/letsencrypt/live/artenojardim.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artenojardim.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # O painel nunca deve aparecer em busca.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml;

    client_max_body_size 12M;
    access_log /var/log/nginx/artenojardim-admin.access.log;
    error_log  /var/log/nginx/artenojardim-admin.error.log;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# -- API --
server {
    listen 443 ssl;
    server_name api.artenojardim.com.br;

    ssl_certificate     /etc/letsencrypt/live/artenojardim.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artenojardim.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml;

    # 12M: o upload vai DIRETO ao storage por URL assinada e nao passa por aqui.
    client_max_body_size 12M;
    access_log /var/log/nginx/artenojardim-api.access.log;
    error_log  /var/log/nginx/artenojardim-api.error.log;

    # Login e refresh: negar aqui custa ~1000x menos que acordar o Node.
    location ~ ^/api/v1/auth/ {
        limit_req zone=artenojardim_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook do Stripe: SEM rate limit. Bloquear o Stripe faz ele reentregar
    # por dias e, no limite, um pedido pago fica sem confirmacao.
    location = /api/v1/webhooks/stripe {
        proxy_pass http://127.0.0.1:4020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Healthcheck fora do rate limit: um 429 aqui faria o monitor achar que caiu.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:4020;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=artenojardim_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
